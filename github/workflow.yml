name: Start tests and deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: 3.13

      - name: Flake8 Linting
        uses: lukacat10/Flake8@v5


  test:
    runs-on: [ubuntu-latest]

    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: 3.13
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name : Start test
        run: pytest

